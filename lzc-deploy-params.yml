params:
  - id: admin_username
    type: string
    name: Login username
    description: "Username for the first account (login is required for this app)."
    default_value: "admin"
    optional: false
  - id: admin_password
    type: secret
    name: Login password
    description: "Password for the first account, at least 12 characters."
    default_value: "$random(len=20)"
    optional: false
locales:
  zh:
    admin_username:
      name: 登录用户名
      description: 首个账号的用户名（本应用需要登录才能使用）。
    admin_password:
      name: 登录密码
      description: 首个账号的密码，至少 12 位。默认随机生成，不存在内置弱口令。
